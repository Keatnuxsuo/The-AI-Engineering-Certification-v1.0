[project]
name = "chat-app"
version = "0.1.0"
description = "A chat web app skeleton — echo stub today, Claude Agent SDK agent tomorrow"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
